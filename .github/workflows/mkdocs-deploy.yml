name: MkDocs Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

# Queue deploys so two quick pushes can't race each other onto gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned so the ubuntu-latest migration to Ubuntu 26 can't break the Python setup.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # No pip cache: it needs a requirements.txt or pyproject.toml, which this repo doesn't have.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Pinned to versions verified with `mkdocs build --strict`; mkdocs 2.0 breaks Material.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
